# product.yaml: the one file a product owes the company.
#
# The company registry (eugnel-hq) reads this file from `main` and never edits it. The AI-SDLC
# channel modules write `live_version` and `live_since`; the baseline step writes `baseline`;
# the owner or an intake writes `status`. Validate with `.ai-sdlc/manifest_check.py product.yaml`
# (run it by hand: the company `manifest` check is pending here, see AGENTS.md). Schema: the
# skill's `schemas/product.schema.json`.

id: rtt
name: Real-Time Translation
status: building             # live for the owner only, behind Cloudflare Access (DEPLOY.md)
repo: eugnel-ltd/RealTimeTranslation
north_star: docs/north-star.md
support: rtt@eugnel.uk

channels:
  web:
    domain: rtt.eugnel.com   # Cloudflare Worker rtt (wrangler.jsonc), static client and /api/*
    live_version: null
    live_since: null

# Not sold yet. The owner named a translation SaaS as an upcoming product (17 Oct 2026).
pricing:
  model: free
  products: []

# The product baseline (skill `modules/baseline.md`). Values: done | missing | waived | excluded.
baseline:
  accounts: missing          # implementation is default-off; customer activation/live acceptance pending
  durable_data: done         # KV namespace PROFILES (candidate profiles)
  payments: missing
  legal: missing
  observability: missing     # instrumentation ready; live Sentry, monitor and usage evidence pending
  support: missing
  listing: done              # verified icon, local-preview screenshots, description, what's new and privacy references
waivers: {}

# Destination metadata is not proof that the project, secret or monitor is live.
sentry:
  org: pgnetwork
  project: rtt
  scope: server

# Current private processing and conditional account capability; provider evidence is in docs/legal/.
legal:
  audience: general
  effective: "2026-10-18"
  data:
    - category: Live microphone audio and transcript text
      purpose: Requested speech recognition, translation and optional question detection or answers
      basis: Legitimate interests in providing the authorised owner's requested professional tool, subject to participant notice and a lawful basis for any third-party data
      retention: Audio is processed as a live stream without app audio-file storage; current transcript and up to 20 answers stay in memory; provider periods are described in Data use
      linked: "Yes"
    - category: Optional browser transcript history
      purpose: Keep future final transcripts only after a positive saved-history choice
      basis: Consent for optional browser history storage, which can be withdrawn for future writes
      retention: No app expiry; until the user deletes the session, clears site data or the browser removes it; turning saving off preserves existing history
      linked: "Yes"
    - category: Browser preferences, personal context and extra notes
      purpose: Remember requested settings and include selected context or notes in optional AI answers
      basis: Legitimate interests in providing the requested settings and answer functions; browser storage is requested through the settings controls
      retention: No app expiry; clear the fields and save or clear this site's browser data; selected material sent to providers follows their periods
      linked: "Yes"
    - category: Candidate profile names and markdown
      purpose: Store the owner's selected profile and add its content to requested AI answers
      basis: Legitimate interests in the authorised professional workflow, subject to a lawful basis and safeguards for any third-party profile data
      retention: No automatic KV expiry; until overwritten or removed by an operator; provider copies are separate
      linked: "Yes"
    - category: Account identity and sign-in proofs when enabled
      purpose: Offer email-code, Google or Apple sign-in, link verified methods and protect account access; these features are disabled in the current private service
      basis: Legitimate interests in providing requested account access and preventing abuse; requested necessary sign-in storage
      retention: Session and deletion-ticket validity up to 30 days; email codes and flows up to 10 minutes; validity is not physical cleanup; pending provider credentials and security records follow the Data use limits
      linked: "Yes"
    - category: Customer candidate profiles when enabled
      purpose: Keep profiles separate for each verified account and include the selected profile in requested Google answers; existing owner KV profiles remain separate
      basis: Legitimate interests in providing the requested professional workflow, subject to safeguards and a lawful basis for third-party information
      retention: No automatic D1 expiry; overwrite or completed account erasure removes current profile records; backups, providers and minimal permanent security fences have separate limits
      linked: "Yes"
    - category: Account security, deletion progress and sign-in mail accounting when enabled
      purpose: Prevent replay and abuse, deliver requested codes, resume deletion safely and avoid restoring erased accounts
      basis: Legitimate interests in securing accounts and completing deletion; legal obligation where a data right applies
      retention: Bounded maintenance removes eligible expired or completed records; completed deletion receipts after 90 days without tickets; mail accounting uses a 62-day cutoff and calendar buckets; permanent random account-ID security fences and unresolved provider work remain as described in Data use
      linked: "Yes"
    - category: Turnstile browser and network signals when configured for sign-in
      purpose: Check requested sign-in attempts for abuse; Cloudflare separately uses signals to improve bot detection under its own notice
      basis: Legitimate interests in necessary sign-in security; Cloudflare's separate controller processing follows its Turnstile privacy notice
      retention: Provider-controlled processing under the Turnstile notice; RTT makes no unsupported fixed retention or local-region promise
      linked: "Yes"
    - category: Access identity, IP address and operational metadata
      purpose: Authenticate the authorised owner, prevent abuse and investigate service errors
      basis: Legitimate interests in securing and operating the private service
      retention: Workers Paid logs follow Cloudflare's current seven-day period; Access periods depend on its plan and exports; customer account databases remain disabled in the current private service
      linked: "Yes"
    - category: Support email sender, recipient, subject, body and timestamps
      purpose: Receive and resolve support and privacy requests
      basis: Legitimate interests in responding to requests and maintaining the service; legal obligation where a data right applies
      retention: Existing support mailbox and R2 records have no configured automatic expiry; an operator handles removal requests and any continuing legal need
      linked: "Yes"
    - category: Planned minimal server failure reports
      purpose: Diagnose server failure categories when Sentry reporting is configured
      basis: Legitimate interests in service reliability and security
      retention: No app queue or backfill; the live Sentry project, region and retention must be established before activation
      linked: "No"
  processors:
    - name: Microsoft Azure Speech and Translator
      purpose: Live speech transcription and translation, plus text translation; Microsoft publishes no-trace processing for these modes
      location: Speech is configured for UK South; Translator and service metadata follow Microsoft terms, not a blanket UK-only guarantee
    - name: Google Gemini API
      purpose: Optional live speech, text translation fallback, question extraction and answers; UK API clients require an eligible Paid Services project
      location: International processing under applicable Google terms; no specific project data region is claimed
    - name: TypeSafe AI, Inc.
      purpose: Optional transcript-window question detection; public privacy terms exclude training on API input and DPA retention is purpose-based
      location: United States hosting, with the published DPA and UK transfer terms
    - name: Cloudflare, Inc.
      purpose: Hosting, Access, request security, owner profile KV and support email/R2; when enabled, separate identity/profile/mail-quota D1, code delivery and Turnstile with its separate controller role for detection improvement
      location: Global service infrastructure under Cloudflare's DPA and UK transfer terms; no additional regional restriction is claimed
    - name: Google sign-in
      purpose: When enabled, verify the requested openid/email sign-in and linked method; Google also processes security information under its own privacy notice
      location: Processing under Google's privacy notice; no account-project regional restriction is established
    - name: Sign in with Apple
      purpose: When enabled, verify the requested sign-in and email or relay address, retain encrypted grants for revocation and process verified account-security notifications
      location: Processing under Apple's Sign in with Apple notice; no RTT-specific region or provider retention period is claimed
    - name: Sentry (Functional Software Inc.)
      purpose: Planned server diagnostics using fixed failure categories and route/status tags, only when reporting is configured
      location: Planned project region is not established; verify it before reporting is activated
