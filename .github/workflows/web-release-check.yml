# No dependencies, app code, Cloudflare credentials or deployment run on this runner.
# Automatic merges explicitly dispatch this workflow: github.token emits no push run.
name: Web release evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read
  statuses: read

concurrency:
  group: rtt-web-release-evidence
  cancel-in-progress: false

jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check the complete reviewed green enforcement chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/web-release.py "$(git rev-parse HEAD)" --evidence-only
