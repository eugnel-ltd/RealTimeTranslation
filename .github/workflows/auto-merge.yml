# Trusted default-branch orchestration only: PR commits are API data, never checked out.
name: Auto-merge

on:
  workflow_run:
    workflows: [AI-SDLC checks]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read
  actions: write

concurrency:
  group: rtt-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Merge only reviewed exact-head green PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/auto-merge.py
