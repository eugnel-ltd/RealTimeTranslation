name: Uptime

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rtt-uptime
  cancel-in-progress: false

jobs:
  uptime:
    if: >-
      vars.RTT_UPTIME_ENABLED == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the pinned shared probe
        run: npm ci --ignore-scripts

      - name: Check RTT with its Access service identity
        id: check
        shell: bash
        env:
          RTT_UPTIME_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          RTT_UPTIME_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          rc=0
          node scripts/uptime.mjs >"$RUNNER_TEMP/rtt-uptime.json" || rc=$?
          cat "$RUNNER_TEMP/rtt-uptime.json"
          printf 'rc=%s\n' "$rc" >>"$GITHUB_OUTPUT"

      - name: Deduplicate incidents and record recovery
        if: always() && steps.check.outputs.rc != ''
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            try {
              const { readFile } = await import('node:fs/promises');
              const { pathToFileURL } = await import('node:url');
              const { manageIncident } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/uptime-incident.mjs`).href);
              const result = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/rtt-uptime.json`, 'utf8'));
              const outcome = await manageIncident({ result, github, ...context.repo, runUrl: process.env.RUN_URL });
              core.info(JSON.stringify(outcome));
            } catch {
              core.setFailed('Uptime incident update failed.');
            }

      - name: Return the monitor result
        if: always() && steps.check.outputs.rc != ''
        shell: bash
        env:
          CHECK_RC: ${{ steps.check.outputs.rc }}
        run: |
          case "$CHECK_RC" in
            0|1|2) exit "$CHECK_RC" ;;
            *) exit 1 ;;
          esac
