# The public loader serves AI-SDLC checks from the signed gate bundle.
# No gate reads .ai-sdlc/. The loader selects GitHub-hosted Ubuntu for this public repo.
name: AI-SDLC checks

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
  # The loader's jobs get an OIDC token for the gate broker (ai-sdlc #731).
  id-token: write

jobs:
  checks:
    uses: eugnel-ltd/ai-sdlc-loader/.github/workflows/checks.yml@v3
    with:
      base: main
